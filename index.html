<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Animal Quest</title>
<style>
  :root {
    --ink: #3b2a1a;
    --ink-soft: #6b5640;
    --paper: #fffaf0;
    --sun: #ffd23f;
    --sun-deep: #f5a300;
    --leaf: #58b947;
    --leaf-deep: #2f8a3a;
    --sky: #bfe9ff;
    --berry: #ff6b6b;
    --water: #5cc3f0;
    --card-shadow: 0 6px 0 rgba(59, 42, 26, .18), 0 12px 24px rgba(59, 42, 26, .18);
    --emoji: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
    --font: "Arial Rounded MT Bold", "Nunito", "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,.7) 0 60px, transparent 61px),
      radial-gradient(circle at 85% 6%, rgba(255,255,255,.55) 0 40px, transparent 41px),
      linear-gradient(#bfe9ff 0%, #dff5d0 55%, #a8dc7a 100%);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overflow: hidden;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible { outline: 5px solid #1d6fe0; outline-offset: 3px; }

  .app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: max(10px, env(safe-area-inset-top)) 16px max(26px, env(safe-area-inset-bottom));
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; justify-content: flex-end; gap: 8px;
    position: relative; z-index: 30; flex: none;
  }
  .pill-btn {
    border: 3px solid #fff;
    background: var(--paper);
    border-radius: 999px;
    padding: 6px 14px;
    min-height: 44px; min-width: 44px;
    font-size: 16px; font-weight: 800;
    box-shadow: 0 4px 0 rgba(59,42,26,.2);
    transition: transform .1s;
  }
  .pill-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(59,42,26,.2); }
  .pill-btn .emo { font-family: var(--emoji); }

  .screen { display: none; flex: 1; min-height: 0; }
  .screen.active { display: flex; }

  /* ---------- start screen ---------- */
  #start {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 18px; padding-bottom: 20px;
  }
  .title-board {
    background: var(--paper);
    border: 6px solid #fff;
    border-radius: 36px;
    padding: 22px 26px 26px;
    box-shadow: var(--card-shadow);
    max-width: 560px; width: 100%;
    position: relative;
    overflow: hidden;
  }
  .hero {
    display: block;
    width: calc(100% + 52px);
    margin: -22px -26px 0;
    height: min(30vh, 290px);
    object-fit: cover;
  }
  .parade {
    font-family: var(--emoji);
    font-size: clamp(34px, 9vw, 56px);
    display: flex; justify-content: center; gap: 4px;
    margin: -0.75em 0 6px;
    position: relative;
    filter: drop-shadow(0 3px 0 rgba(255,255,255,.9));
  }
  .parade span { display: inline-block; animation: hop 1.6s ease-in-out infinite; }
  .parade span:nth-child(2) { animation-delay: .2s; }
  .parade span:nth-child(3) { animation-delay: .4s; }
  .parade span:nth-child(4) { animation-delay: .6s; }
  .parade span:nth-child(5) { animation-delay: .8s; }
  @keyframes hop { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-12px); } }
  h1 {
    margin: 4px 0 2px;
    font-size: clamp(30px, 8vw, 48px);
    line-height: 1.1;
    color: var(--leaf-deep);
    text-shadow: 0 3px 0 #d8f0b8;
  }
  .subtitle { margin: 0 0 10px; font-size: clamp(16px, 4vw, 20px); color: var(--ink-soft); font-weight: 700; }
  .howto { margin: 8px 0 18px; font-size: clamp(18px, 4.6vw, 22px); line-height: 1.5; }
  .big-btn {
    border: none;
    background: linear-gradient(#ffdf5e, var(--sun-deep));
    color: #4a2c00;
    font-size: clamp(24px, 6vw, 32px);
    font-weight: 900;
    padding: 14px 44px;
    min-height: 64px;
    border-radius: 999px;
    box-shadow: 0 7px 0 #c47a00, 0 14px 24px rgba(196,122,0,.35);
    transition: transform .1s, box-shadow .1s;
  }
  .big-btn:hover { filter: brightness(1.05); }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #c47a00, 0 6px 12px rgba(196,122,0,.3); }
  .big-btn.green { background: linear-gradient(#8ee36f, var(--leaf-deep)); color: #fff; box-shadow: 0 7px 0 #1e6428, 0 14px 24px rgba(30,100,40,.35); text-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .big-btn.green:active { box-shadow: 0 2px 0 #1e6428; }

  /* ---------- play screen ---------- */
  #play { flex-direction: column; gap: 8px; align-items: stretch; margin-top: -44px; }
  .side { display: flex; flex-direction: column; gap: 8px; flex: none; }
  .hud {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding-right: 140px; /* room for top buttons */
    min-height: 44px;
  }
  .chip {
    background: var(--paper);
    border: 3px solid #fff;
    border-radius: 999px;
    padding: 4px 12px;
    font-weight: 800; font-size: 15px;
    box-shadow: 0 3px 0 rgba(59,42,26,.15);
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .chip .emo { font-family: var(--emoji); }
  #starChip.bump { animation: bump .45s ease; }
  @keyframes bump { 40% { transform: scale(1.3); } }

  .progress-row { display: flex; align-items: center; gap: 10px; }
  .segments { display: flex; gap: 6px; flex: 1; }
  .seg {
    flex: 1; height: 16px; border-radius: 8px;
    background: rgba(255,255,255,.75);
    border: 2px solid #fff;
    box-shadow: inset 0 2px 0 rgba(0,0,0,.08);
    overflow: hidden;
  }
  .seg.on {
    background: linear-gradient(#ffe36e, var(--sun-deep));
    box-shadow: 0 0 10px rgba(255,190,0,.9);
    animation: segpop .4s ease;
  }
  @keyframes segpop { 50% { transform: scaleY(1.5); } }
  .progress-text { font-weight: 900; font-size: 20px; min-width: 60px; text-align: right; }

  .quest-card {
    background: var(--paper);
    border: 5px solid #fff;
    border-radius: 22px;
    box-shadow: var(--card-shadow);
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    position: relative;
  }
  .quest-card::before {
    content: "📜"; font-family: var(--emoji);
    font-size: 30px;
  }
  .quest-card.flip { animation: flip .45s ease; }
  @keyframes flip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  .quest-text { font-size: clamp(24px, 7vw, 38px); font-weight: 900; line-height: 1.15; text-align: center; }
  .quest-text .find { color: var(--ink-soft); }
  .quest-text .word { color: #d2401f; letter-spacing: .5px; }

  .feedback {
    min-height: 30px; text-align: center;
    font-size: clamp(18px, 5vw, 22px); font-weight: 900;
  }
  .feedback.good { color: var(--leaf-deep); }
  .feedback.try { color: #e2611a; }
  .feedback.show { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

  .map-wrap {
    flex: 1; min-height: 240px;
    display: flex; align-items: center; justify-content: center;
    container-type: size;
  }
  .map {
    position: relative;
    width: 100%;
    width: min(100cqw, 100cqh * 10 / 9);
    aspect-ratio: 10 / 9;
    border-radius: 28px;
    border: 6px solid #fff;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    container-type: inline-size;
    background: #8fd35f;
  }
  .map img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }

  .animal {
    position: absolute;
    width: 18%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 4px solid #fff;
    background: radial-gradient(circle at 40% 35%, #ffffff 0%, #fff8e6 70%, #f3e6c4 100%);
    box-shadow: 0 5px 0 rgba(59,42,26,.25), 0 8px 14px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    font-family: var(--emoji);
    font-size: 40px;
    font-size: 10.5cqw;
    line-height: 1;
    transition: transform .15s, filter .15s, opacity .3s;
    z-index: 2;
  }
  .animal .face { display: block; pointer-events: none; animation: idle 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  @keyframes idle { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4%) rotate(-4deg); } }
  @media (hover: hover) {
    .animal:not(:disabled):hover { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.05); }
  }
  .animal:not(:disabled):active { transform: translate(-50%, -50%) scale(.94); }
  .animal.found {
    opacity: .5;
    filter: grayscale(.4);
    cursor: default;
    border-color: #b9f59c;
  }
  .animal.found::after {
    content: "✔";
    position: absolute; right: -4%; top: -4%;
    width: 36%; aspect-ratio: 1;
    border-radius: 50%;
    background: var(--leaf-deep); color: #fff;
    font-family: var(--font);
    font-size: 4.5cqw;
    display: flex; align-items: center; justify-content: center;
    border: 3px solid #fff;
  }
  .animal.glow {
    opacity: 1; filter: none;
    z-index: 5;
    animation: glow .9s ease forwards;
  }
  @keyframes glow {
    0% { box-shadow: 0 0 0 0 rgba(255,214,0,.95); transform: translate(-50%, -50%) scale(1); background: #fff7b0; }
    30% { box-shadow: 0 0 0 14px rgba(255,214,0,.7), 0 0 40px 18px rgba(255,236,120,.9); transform: translate(-50%, -50%) scale(1.25); background: #fff7b0; }
    100% { box-shadow: 0 0 0 6px rgba(255,214,0,0), 0 0 0 0 rgba(255,236,120,0); transform: translate(-50%, -50%) scale(1); }
  }
  .animal.shake { animation: shake .45s ease; }
  @keyframes shake {
    0%, 100% { transform: translate(-50%, -50%); }
    20% { transform: translate(-58%, -50%) rotate(-6deg); }
    40% { transform: translate(-42%, -50%) rotate(6deg); }
    60% { transform: translate(-55%, -50%) rotate(-4deg); }
    80% { transform: translate(-46%, -50%) rotate(3deg); }
  }

  .praise {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 11cqw; font-weight: 900;
    color: #fff;
    -webkit-text-stroke: 1.5cqw var(--sun-deep);
    paint-order: stroke fill;
    text-shadow: 0 1cqw 0 #c47a00;
    pointer-events: none; z-index: 8;
    white-space: nowrap;
    animation: praise 1s ease forwards;
  }
  @keyframes praise {
    0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; }
    25% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    75% { transform: translate(-50%, -60%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -75%) scale(.9); opacity: 0; }
  }
  .spark {
    position: absolute; font-family: var(--emoji);
    font-size: 5cqw; pointer-events: none; z-index: 7;
    transform: translate(-50%, -50%);
  }
  .fly-star {
    position: fixed; z-index: 60; pointer-events: none;
    font-family: var(--emoji); font-size: 40px;
    transform: translate(-50%, -50%);
  }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(40, 70, 30, .45);
    display: none; align-items: center; justify-content: center;
    padding: 70px 16px 40px;
  }
  .overlay.active { display: flex; }
  .panel {
    background: var(--paper);
    border: 6px solid #fff;
    border-radius: 32px;
    box-shadow: var(--card-shadow);
    padding: 24px 24px 30px;
    width: 100%; max-width: 440px;
    text-align: center;
    animation: pop .45s ease;
  }
  .panel h2 { margin: 0 0 6px; font-size: clamp(30px, 8vw, 42px); color: var(--leaf-deep); }
  .panel .lvname { margin: 0 0 10px; font-size: 20px; font-weight: 800; color: var(--ink-soft); }
  .panel .stars-big { font-family: var(--emoji); font-size: clamp(44px, 13vw, 64px); letter-spacing: 6px; margin: 6px 0; }
  .panel .stars-big span { display: inline-block; animation: starin .5s ease backwards; }
  .panel .stars-big span:nth-child(2) { animation-delay: .15s; }
  .panel .stars-big span:nth-child(3) { animation-delay: .3s; }
  @keyframes starin { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1); } }
  .panel .score { font-size: clamp(28px, 8vw, 40px); font-weight: 900; margin: 4px 0 18px; }
  .panel .score .emo { font-family: var(--emoji); }
  .panel .msg { font-size: 20px; margin: 0 0 18px; line-height: 1.4; }
  .confetti {
    position: fixed; top: -40px; z-index: 25; pointer-events: none;
    font-family: var(--emoji); font-size: 28px;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

  .credit {
    position: fixed; right: 12px; bottom: max(6px, env(safe-area-inset-bottom));
    font-size: 12px; color: #6d7a66;
    z-index: 40; pointer-events: none;
  }

  /* wide but short screens (phone landscape) */
  @media (orientation: landscape) and (max-height: 560px) {
    #play { flex-direction: row-reverse; gap: 14px; margin-top: -44px; }
    #play .side { width: 38%; max-width: 340px; justify-content: center; padding-top: 48px; }
    .hud { padding-right: 0; }
    .map-wrap { min-height: 0; }
    .quest-text { font-size: clamp(22px, 4vw, 32px); }
  }
  @media (min-width: 900px) and (min-height: 600px) {
    #play { max-width: 900px; width: 100%; margin-left: auto; margin-right: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>

        osc.start(now + start);
        osc.stop(now + start + dur + 0.05);
      });

  /* ---------------- rendering ---------------- */
  function renderTexts() {
    const tx = t();
    document.documentElement.lang = state.lang === "en" ? "en" : "zh-Hant";
    document.title = TEXT.en.title + " | " + TEXT.zh.title;
    document.querySelectorAll("[data-t]").forEach(el => { el.textContent = tx[el.dataset.t]; });
    els.langBtn.textContent = tx.langBtn;
    els.langBtn.lang = state.lang === "en" ? "zh-Hant" : "en";
    els.langBtn.setAttribute("aria-label", tx.langLabel);
    els.soundBtn.setAttribute("aria-label", state.sound ? tx.soundOn : tx.soundOff);
    els.soundIcon.textContent = state.sound ? "🔊" : "🔇";

    const lv = LEVELS[state.level];
    els.levelChip.textContent = tx.level(state.level + 1) + " · " + lv[state.lang];
    els.clearLevelName.textContent = tx.level(state.level + 1) + " · " + lv[state.lang];
    els.findLabel.textContent = tx.find;
    els.map.querySelectorAll(".animal").forEach((b, i) => b.setAttribute("aria-label", tx.animalLabel(i + 1)));
    renderFeedback(false);
  }

  function renderHud() {
    const n = state.found.size;
    els.progressText.textContent = n + "/3";
    [...els.segments.children].forEach((seg, i) => seg.classList.toggle("on", i < n));
    els.starCount.textContent = state.stars;
    const target = state.order[state.qIndex];
    els.questWord.textContent = target || "";
    els.clearScore.textContent = state.stars + "/" + TOTAL_STARS;
    els.finalScore.textContent = state.stars + "/" + TOTAL_STARS;
  }

  function renderFeedback(animate) {
    const fb = state.feedback;
    els.feedback.className = "feedback";
    if (!fb) { els.feedback.textContent = ""; return; }
    els.feedback.textContent = fb.kind === "try" ? t().tryAgain : t().praise[fb.idx];
    els.feedback.classList.add(fb.kind === "try" ? "try" : "good");
    if (animate) { void els.feedback.offsetWidth; els.feedback.classList.add("show"); }
  }

  function buildMap() {
    const lv = LEVELS[state.level];
    const animals = shuffle(lv.targets.concat(lv.distractors));
    const spots = shuffle(SPOTS).slice(0, animals.length);
    els.map.innerHTML = `<img class="bg" src="${MAP_IMAGES[state.level]}" alt="" draggable="false">`;
    animals.forEach((id, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "animal";
      b.dataset.id = id;
      b.style.left = spots[i][0] + "%";
      b.style.top = spots[i][1] + "%";
      b.style.setProperty("--d", (i * 0.35) + "s");
      b.innerHTML = `<span class="face" aria-hidden="true">${ANIMALS[id]}</span>`;
      b.addEventListener("click", onAnimal);
      els.map.appendChild(b);
    });
  }

  function showScreen(name) {
    state.screen = name;
    els.start.classList.toggle("active", name === "start");
    els.play.classList.toggle("active", name !== "start");
    els.clearOverlay.classList.toggle("active", name === "clear");
    els.finalOverlay.classList.toggle("active", name === "final");
    els.map.querySelectorAll(".animal").forEach(b => { b.tabIndex = name === "play" ? 0 : -1; });
  }

  function startLevel(level) {
    state.level = level;
    state.order = shuffle(LEVELS[level].targets);
    state.qIndex = 0;
    state.found = new Set();
    state.feedback = null;
    state.locked = false;
    buildMap();
    showScreen("play");
    renderTexts();
    renderHud();
    flipCard();
    const first = els.map.querySelector(".animal");
    if (first && document.activeElement && document.activeElement !== document.body) first.focus({ preventScroll: true });
  }

  function newGame() {
    state.stars = 0;
    startLevel(0);
  }

  function flipCard() {
    els.questCard.classList.remove("flip");
    void els.questCard.offsetWidth;
    els.questCard.classList.add("flip");
  }

  /* ---------------- gameplay ---------------- */
  function onAnimal(e) {
    const btn = e.currentTarget;
    if (state.screen !== "play" || state.locked || btn.disabled) return;
    const id = btn.dataset.id;
    const target = state.order[state.qIndex];

    if (id === target) {
      state.locked = true;                 // blocks any repeat scoring for this question
      state.found = new Set(state.found).add(id);
      state.stars += 1;
      state.feedback = { kind: "good", idx: Math.floor(Math.random() * t().praise.length) };
      btn.disabled = true;
      btn.classList.remove("shake");
      btn.classList.add("found", "glow");
      sfx.good();
      celebrate(btn);
      renderFeedback(true);
      renderHud();

      setTimeout(() => {
        btn.classList.remove("glow");
        if (state.found.size >= 3) {
          finishLevel();
        } else {
          state.qIndex += 1;
          state.feedback = null;
          renderFeedback(false);
          renderHud();
          flipCard();
          state.locked = false;
        }
      }, 1000);
    } else {
      state.feedback = { kind: "try" };
      sfx.try();
      btn.classList.remove("shake");
      void btn.offsetWidth;
      btn.classList.add("shake");
      renderFeedback(true);
    }
  }

  function celebrate(btn) {
    const tx = t();
    const pop = document.createElement("div");
    pop.className = "praise";
    pop.textContent = tx.praise[state.feedback.idx];
    els.map.appendChild(pop);
    setTimeout(() => pop.remove(), 1000);

    // sparkle burst around the animal
    const x = parseFloat(btn.style.left), y = parseFloat(btn.style.top);
    for (let i = 0; i < 8; i++) {
      const sp = document.createElement("span");
      sp.className = "spark";
      sp.textContent = i % 2 ? "✨" : "⭐";
      sp.style.left = x + "%";
      sp.style.top = y + "%";
      els.map.appendChild(sp);
      const ang = (Math.PI * 2 * i) / 8;
      sp.animate([
        { transform: "translate(-50%,-50%) scale(.4)", opacity: 1 },
        { transform: `translate(calc(-50% + ${Math.cos(ang) * 260}%), calc(-50% + ${Math.sin(ang) * 260}%)) scale(1)`, opacity: 0 }
      ], { duration: 700, easing: "ease-out" });
      setTimeout(() => sp.remove(), 720);
    }

    // a star flies into the star counter
    const from = btn.getBoundingClientRect();
    const to = els.starChip.getBoundingClientRect();
    const star = document.createElement("div");
    star.className = "fly-star";
    star.textContent = "⭐";
    document.body.appendChild(star);
    const sx = from.left + from.width / 2, sy = from.top + from.height / 2;
    const ex = to.left + 20, ey = to.top + to.height / 2;
    star.style.left = sx + "px";
    star.style.top = sy + "px";
    const anim = star.animate([
      { transform: "translate(-50%,-50%) scale(1.4)" },
      { transform: `translate(calc(-50% + ${(ex - sx) / 2}px), calc(-50% + ${(ey - sy) / 2 - 60}px)) scale(1.2)`, offset: .5 },
      { transform: `translate(calc(-50% + ${ex - sx}px), calc(-50% + ${ey - sy}px)) scale(.6)` }
    ], { duration: 650, easing: "ease-in" });
    anim.onfinish = () => {
      star.remove();
      els.starChip.classList.remove("bump");
      void els.starChip.offsetWidth;
      els.starChip.classList.add("bump");
    };
  }

  function finishLevel() {
    state.feedback = null;
    renderFeedback(false);
    sfx.clear();
    if (state.level < LEVELS.length - 1) {
      showScreen("clear");
      renderTexts();
      renderHud();
      els.nextBtn.focus({ preventScroll: true });
    } else {
      showScreen("final");
      renderTexts();
      renderHud();
      confetti();
      els.againBtn.focus({ preventScroll: true });
    }
  }

  function confetti() {
    const pieces = ["⭐", "🌟", "🍃", "🌸", "✨"];
    for (let i = 0; i < 28; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = pieces[i % pieces.length];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = (2.2 + Math.random() * 2) + "s";
      c.style.animationDelay = (Math.random() * .8) + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }

  /* ---------------- controls ---------------- */
  els.startBtn.addEventListener("click", () => { sfx.tap(); newGame(); });
  els.nextBtn.addEventListener("click", () => {
    if (state.screen !== "clear") return;
    sfx.tap();
    startLevel(state.level + 1);
  });
  els.againBtn.addEventListener("click", () => {
    if (state.screen !== "final") return;
    sfx.tap();
    newGame();
  });
  els.langBtn.addEventListener("click", () => {
    state.lang = state.lang === "en" ? "zh" : "en";
    renderTexts();     // only texts change; level, question, map and stars stay
  });
  els.soundBtn.addEventListener("click", () => {
    state.sound = !state.sound;
    renderTexts();
    sfx.tap();
  });

  renderTexts();
  renderHud();
})();
</script>
</body>
</html>
